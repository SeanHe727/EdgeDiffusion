# ══════════════════════════════════════════════════════════════════════════════
# quantize_config.yaml  —  GPU 量化流程配置
#
# 用法：
#   python quantize/quantize.py --recipe int8_weight_only   # 量化保存一个方案
#   python quantize/evaluate.py                              # 对比所有保存的方案
#
# CLI 参数始终覆盖本文件中的对应字段。
# ══════════════════════════════════════════════════════════════════════════════

# ── 模型路径 ──────────────────────────────────────────────────────────────────
base_model:    stabilityai/sd-turbo                              # base pipeline (text_encoder, VAE, scheduler, tokenizer)
unet_repo:     ChenHe727/EdgeDiffusion_distilled_feat_attn       # HF repo containing distill_final.safetensors + .config.json
unet_filename: distill_final.safetensors                          # weights file name in the repo (sidecar = same name + .config.json)
# 或者用本地路径覆盖（CLI: --unet-weights / --unet-config），跳过 HF 下载
unet_weights:  null
unet_config:   null

# ── 输出 ──────────────────────────────────────────────────────────────────────
output_dir:    models                                    # 量化后的 UNet 保存目录（命名：EdgeDiffuse_r4_<recipe>.safetensors）
results_dir:   quantize/results                          # evaluate.py 输出对比图 + JSON

# ── 推理设置（quantize.py 验证用 + evaluate.py 生成图用）─────────────────────
inference_steps:    4
guidance_scale:     0.0
resolution:         512
seed:               42

# ── 评估用 prompts ────────────────────────────────────────────────────────────
# 选取覆盖细节、色彩、人脸、文字、复杂场景的代表性 prompt
eval_prompts:
  - "a photo of a tabby cat sitting on a wooden chair, sharp focus"
  - "a portrait of a young woman with red hair, studio lighting"
  - "an oil painting of a stormy ocean at sunset, dramatic clouds"
  - "a futuristic city skyline at night, neon lights, cyberpunk"
  - "a close-up of a red apple with water droplets, macro photography"
  - "a golden retriever puppy running in a meadow, motion blur"
  - "a coffee shop interior with warm lighting, plants, books"
  - "a fantasy castle on a mountain, mist, soft light"

# ── 评估方案（哪些方案要 evaluate）────────────────────────────────────────────
# 留空 = 自动扫描 output_dir 下所有 EdgeDiffuse_r4_*.safetensors
# 也可手动指定具体方案名
eval_recipes:
  - fp16
  - int8_weight_only
  - int8_dynamic
  - fp8_dynamic
  - int4_weight_only

# ── 速度测量 ──────────────────────────────────────────────────────────────────
benchmark_runs:  5      # 每个方案跑几次取中位数（去掉第一次 warmup）
benchmark_warmup: 1     # warmup 次数（不计入测量）
