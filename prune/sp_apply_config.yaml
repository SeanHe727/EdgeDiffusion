# ══════════════════════════════════════════════════════════════════════════════
# sp_apply_config.yaml  —  Single source of truth for pruning
#
# Usage:
#   python prune/sp_apply.py                           # uses this file
#   python prune/sp_apply.py --warmup 50               # CLI overrides one value
#   python prune/sp_apply.py --run-config other.yaml   # swap config file
# ══════════════════════════════════════════════════════════════════════════════

# ── Environment paths ─────────────────────────────────────────────────────────
hf_cache: .hf_cache
tmp_dir:  .tmp

# ── Model ─────────────────────────────────────────────────────────────────────
base_model:           models/sd-turbo
inference_timesteps:  "999,749,499,249"
device:               null   # null = auto-detect (cuda if available, else cpu)

# ── Pruning target ─────────────────────────────────────────────────────────────
config:  prune/pruning_config_r1.json
# target: "8%"    # auto-detected when config has exactly one entry
round:   1        # written into pruning_config.json history

# For iterative pruning (round 2+): set these to the previous round output
model_path:   null  # e.g. models/round1_pruned.safetensors
model_config: null  # auto-derived from model_path if null

# ── Calibration data ──────────────────────────────────────────────────────────
# Priority: calib_data file → generate from dataset → random (smoke test)
calib_data:  null         # path to .pt from sensitivity_ld.py; null = generate
dataset:     dataset      # directory of .txt prompts for teacher inference
max_samples: 64           # prompts used; each yields 4 timestep samples

# ── Output ────────────────────────────────────────────────────────────────────
output: models/round1_pruned.safetensors

# ── Taylor pipeline ───────────────────────────────────────────────────────────
warmup:          200    # steps to accumulate |w×∇w| Taylor scores
softmask:       5000    # steps to train with soft channel masks
rampup:         1000    # steps to linearly increase pruning ratio 0% → target
reeval_interval: 100    # re-rank channel importance every N softmask steps

# Advanced — safe to leave as-is unless you know what you're changing
round_to_val:    32     # channel count rounding granularity (e.g. 32, 64)
ffn_max_prune:   0.10   # max ratio prunable per FFN layer
max_prune_ratio: 0.40   # global cap on pruning ratio per layer
taylor_mode:     avg    # how to combine scores across timesteps: "avg" or "max"

# ── Smoke test fallback ───────────────────────────────────────────────────────
# Only used when calib_data=null AND dataset directory is not found
smoke_test_samples: 8
