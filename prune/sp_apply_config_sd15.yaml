# ══════════════════════════════════════════════════════════════════════════════
# sp_apply_config_sd15.yaml  —  Pruning config for SD 1.5
#
# Usage:
#   python prune/sp_apply.py --run-config prune/sp_apply_config_sd15.yaml
#   python prune/sp_apply.py --run-config prune/sp_apply_config_sd15.yaml --warmup 50
# ══════════════════════════════════════════════════════════════════════════════

# ── Environment paths ─────────────────────────────────────────────────────────
hf_cache: .hf_cache
tmp_dir:  .tmp

# ── Model ─────────────────────────────────────────────────────────────────────
base_model:           models/sd-1-5
# SD 1.5 uses 20-step PNDM (t: 999→49). 8 anchors give denser coverage than
# SD-Turbo's 4 steps. Middle range (649→249) is sampled more densely because
# semantic structure forms there and Taylor gradients are most informative.
# t=999 skipped: max-noise gradients are high-magnitude but low-direction.
inference_timesteps:  "849,749,649,549,449,349,249,149"
device:               null

# ── Pruning target ─────────────────────────────────────────────────────────────
config:  prune/pruning_config_sd15_r1.json
round:   1

model_path:   null
model_config: null

# ── Calibration data ──────────────────────────────────────────────────────────
calib_data:  null
dataset:     dataset
max_samples: 64

# ── Output ────────────────────────────────────────────────────────────────────
output: models/sd15_round1_pruned.safetensors

# ── Taylor pipeline ───────────────────────────────────────────────────────────
warmup:          200
softmask:        5000
rampup:          1000
reeval_interval: 100

round_to_val:    32
ffn_max_prune:   0.10
max_prune_ratio: 0.40
taylor_mode:     weighted   # Min-SNR weighting: middle timesteps (t≈500) get higher weight

smoke_test_samples: 8
