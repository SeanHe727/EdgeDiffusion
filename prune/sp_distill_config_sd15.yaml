# ══════════════════════════════════════════════════════════════════════════════
# sp_distill_config_sd15.yaml  —  Distillation config for SD 1.5
#
# Usage:
#   python prune/sp_distill.py --run-config prune/sp_distill_config_sd15.yaml
# ══════════════════════════════════════════════════════════════════════════════

# ── Environment paths ─────────────────────────────────────────────────────────
hf_cache: .hf_cache
tmp_dir:  .tmp

# ── Model ─────────────────────────────────────────────────────────────────────
base_model:    models/sd-1-5
pruned_model:  models/sd15_round1_pruned.safetensors
device:        null

# ── Data ──────────────────────────────────────────────────────────────────────
dataset:     dataset
max_samples: 5000

# ── Output ────────────────────────────────────────────────────────────────────
output_dir:          models/distill_sd15_r1
save_every:          1000
keep_checkpoints:    3
log_every:           20

# ── Training phases ───────────────────────────────────────────────────────────
resolution:      512
main_steps:      5000
finetune_steps:  1000

# ── Optimizer ─────────────────────────────────────────────────────────────────
lr_max:          2.0e-5
lr_min:          1.0e-6
lr_warmup_steps: 100
lr_decay_start:  2500
weight_decay:    0.01
grad_clip:       1.0

# ── Loss ──────────────────────────────────────────────────────────────────────
lambda_l1: 0.15    # slightly higher than SD-Turbo (0.1) — SD 1.5 has more blurring
                   # tendency due to 20-step schedule and larger model capacity gap

# ── Training details ──────────────────────────────────────────────────────────
batch_size:       1
grad_accum_steps: 4
# SD 1.5 uses 20-step PNDM scheduler.
# For distillation we still use 4 steps — teacher runs 4 representative steps
# and student matches predictions at each. Full 20-step distillation would be
# 5x slower with marginal quality gain for our structural pruning scenario.
n_steps_min:      4
n_steps_max:      4
num_workers:      2
gc_every:         200

# ── Model EMA ─────────────────────────────────────────────────────────────────
# total steps = 6000, memory = 1/(1-decay)
# 0.9995 → memory ~2000 steps = ~33% of training → good balance
ema_decay:        0.9995
ema_norm_decay:   0.99

# ── Attention Map Distillation ────────────────────────────────────────────────
teacher_cache_dir:  null

lambda_attn:        0.02
attn_warmup_steps:  500

# SD 1.5 layer names are the same structure as SD-Turbo (both are SD UNet)
attn_layers:
  - mid_block.attentions.0.transformer_blocks.0.attn1
  - mid_block.attentions.0.transformer_blocks.0.attn2
  - down_blocks.2.attentions.0.transformer_blocks.0.attn1
  - down_blocks.2.attentions.0.transformer_blocks.0.attn2
  - up_blocks.0.attentions.0.transformer_blocks.0.attn1
  - up_blocks.0.attentions.0.transformer_blocks.0.attn2
  - up_blocks.1.attentions.0.transformer_blocks.0.attn1
  - up_blocks.1.attentions.0.transformer_blocks.0.attn2
