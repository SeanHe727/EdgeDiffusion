# ══════════════════════════════════════════════════════════════════════════════
# sp_distill_rollout_feat_pred_5k_config.yaml  —  rollout latent + light feature + small pred anchor
#
# Usage:
#   python prune/sp_distill.py                           # uses this file
#   python prune/sp_distill.py --phase1-steps 500        # CLI overrides one value
#   python prune/sp_distill.py --run-config other.yaml   # swap config file
# ══════════════════════════════════════════════════════════════════════════════

# ── Environment paths ─────────────────────────────────────────────────────────
hf_cache: .hf_cache
tmp_dir:  .tmp

# ── Model ─────────────────────────────────────────────────────────────────────
base_model:    models/sd-turbo
pruned_model:  models/distill_latent_step_final_4steps_2h/distill_final.safetensors    # student starting point
device:        null                               # null = auto (cuda if available)

# ── Data ──────────────────────────────────────────────────────────────────────
dataset:     dataset      # directory of .txt prompt files
max_samples: 5000         # prompts loaded into dataset (shuffled, seed=42)

# ── Output ────────────────────────────────────────────────────────────────────
output_dir:           models/distill_rollout_feat_pred_4steps_5k      # checkpoints saved here
save_every:           300                         # save checkpoint every N steps
keep_checkpoints:     3                           # max checkpoints to keep on disk
log_every:            20                          # log loss/lr every N steps

# ── Training phases — both at native 512px ────────────────────────────────────
resolution:      512

# Main: primary quality recovery
main_steps:      5000  # ~2h smoke test on G5 with live teacher + feature hooks

# Finetune: low LR final polish (set to 0 to skip)
finetune_steps:  0      # disabled for the short feature-loss test

# ── Optimizer ─────────────────────────────────────────────────────────────────
lr_max:          1.5e-5   # peak learning rate (5e-5 is too aggressive for distillation recovery)
lr_min:          1.0e-6   # floor for cosine decay
lr_warmup_steps: 100      # linear warmup from lr_min → lr_max
lr_decay_start:  1000     # step to start cosine decay (null = start after warmup)
weight_decay:    0.01
grad_clip:       1.0      # gradient norm clip

# ── Loss ──────────────────────────────────────────────────────────────────────
lambda_pred:      0.1     # prediction loss is now an anchor; feature loss is the main distillation signal
lambda_l1:        0.1     # weight of L1 term alongside MSE — preserves high-frequency detail
                          # MSE alone blurs by averaging; L1 penalises all deviations equally
lambda_feat:      0.1     # disabled for latent-loss baseline

# ── Training details ──────────────────────────────────────────────────────────
batch_size:       1       # cache mode: teacher off GPU, bs=2 fits in VRAM
grad_accum_steps: 4       # accumulate over N batches before optimizer.step() → effective_bs=4
n_steps_min:      4       # fixed 4-step inference — consistent timestep schedule [999,749,499,249]
n_steps_max:      4       # same as min = fixed steps (set min<max to re-enable randomness)
num_workers:      2       # DataLoader workers
gc_every:         200     # run torch/python GC every N steps

# ── Model EMA ─────────────────────────────────────────────────────────────────
ema_decay:        0.9995  # shadow weight decay — memory ~1000 steps (1/(1-decay))
ema_norm_decay:   0.99    # per-timestep loss normalisation EMA — smooths out scale differences
                          # between high-noise (t=999) and near-clean (t=249) timesteps

# ── Attention Map Distillation ────────────────────────────────────────────────
# Set teacher_cache_dir to a pre-computed cache to remove the teacher UNet from
# GPU during training (~3-5 GB VRAM freed → allows larger batch_size).
# Generate cache first:  python prune/gen_teacher_cache.py --cache-dir teacher_cache
#
# lambda_attn = 0 disables attention map loss entirely (pure prediction-space distillation).
# Ramp-up: lambda_attn grows linearly from 0 → target over attn_warmup_steps so the
# student first establishes basic prediction quality before attention alignment is added.

teacher_cache_dir:  null    # path to pre-computed cache dir, or null to run teacher live

lambda_latent:      0.0     # post-step latent distillation, matching sensitivity_ld teacher_next_latent target
lambda_final_latent: 0.0
lambda_rollout_latent: 1.0    # student rollout: match every intermediate latent to teacher trajectory

lambda_attn:        0.0     # disabled for the latent-loss baseline
                            # 0.02 = conservative start; increase to 0.05 if attn loss is stable
attn_warmup_steps:  500     # ramp lambda_attn from 0 → target over this many optimizer steps

attn_layers:
  - mid_block.attentions.0.transformer_blocks.0.attn1
  - mid_block.attentions.0.transformer_blocks.0.attn2
  - down_blocks.2.attentions.0.transformer_blocks.0.attn1
  - down_blocks.2.attentions.0.transformer_blocks.0.attn2
  - up_blocks.1.attentions.0.transformer_blocks.0.attn1
  - up_blocks.1.attentions.0.transformer_blocks.0.attn2
  - up_blocks.2.attentions.0.transformer_blocks.0.attn1
  - up_blocks.2.attentions.0.transformer_blocks.0.attn2

# ── Large Block Feature Distillation ─────────────────────────────────────────
# Each layer output is normalized before MSE.  If pruning changes channel count,
# the script falls back to a normalized spatial energy map for that block.
feat_layers:
  - down_blocks.0
  - down_blocks.1
  - down_blocks.2
  - down_blocks.3
  - mid_block
  - up_blocks.0
  - up_blocks.1
  - up_blocks.2
  - up_blocks.3
