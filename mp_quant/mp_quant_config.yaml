# ══════════════════════════════════════════════════════════════════════════════
# mp_quant_config.yaml  —  Sensitivity-aware mixed-precision quantization config
#
# Pipeline stages (run in order):
#   1. sensitivity.py       Per-layer × per-bit-width sensitivity profiling
#   2. bitwidth_solver.py   Bit-width assignment from sensitivity curves
#   3. apply_quant.py       Apply chosen per-layer bit-widths
#   4. qat_distill.py       Recover quality via teacher-student distillation
#   5. evaluate.py          FID + CLIP + LPIPS + latency benchmark
# ══════════════════════════════════════════════════════════════════════════════

# ── Model paths ───────────────────────────────────────────────────────────────
base_model:    stabilityai/sd-turbo                              # text_encoder, VAE, scheduler, tokenizer
unet_repo:     ChenHe727/EdgeDiffusion_distilled_feat_attn       # latest pruned + distilled UNet
unet_filename: distill_final.safetensors                          # weights file in the repo

# Local override (CLI: --unet-weights). If null, downloads from HF.
unet_weights:  null
unet_config:   null

# ── Output directories ────────────────────────────────────────────────────────
output_dir:    mp_quant/output                  # quantized model checkpoints
results_dir:   mp_quant/results                 # sensitivity reports, plots, configs

# ── Calibration data (shared with prune/) ────────────────────────────────────
calib_dataset:     dataset                       # directory of .txt prompts
calib_max_prompts: 32                            # how many prompts for sensitivity profiling

# ── Quantization candidates ──────────────────────────────────────────────────
# Each layer will be tested at these bit-widths.
# fp16 is the reference (no quantization).
quant_candidates:
  - int8                # weight-only INT8 via torchao
  - int4                # weight-only INT4 via torchao (TILE_PACKED_TO_4D, bf16 only)

# ── Layers to skip during quantization ───────────────────────────────────────
# These are known-sensitive and are never quantized regardless of solver output.
# Mirrors common practice in diffusion quantization papers.
skip_layers:
  - conv_in              # first conv: 4 → 320 channels, very sensitive
  - conv_out             # last conv: 320 → 4 channels, drives VAE quality
  - time_embedding       # tiny but globally referenced
  - time_emb_proj        # ditto
  - add_embedding        # if present

# ── Inference settings (used for sensitivity + evaluation) ───────────────────
inference_steps:  2
guidance_scale:   0.0
resolution:       512
seed:             42

# ── Bit-width solver settings ────────────────────────────────────────────────
target_size_reduction: 0.40   # try to remove 40% of UNet size (Linear+Conv weights only)
solver_granularity:    0.05   # ratio snap granularity (0.05 = 5%)

# ── QAT distillation (Stage 4) ────────────────────────────────────────────────
qat_steps:        2000
qat_lr_max:       1.0e-5
qat_lr_min:       1.0e-7
qat_warmup_steps: 100
qat_batch_size:   1
qat_grad_accum:   4

# ── Evaluation prompts (Stage 5 quick visual + metric eval) ──────────────────
eval_prompts:
  - "a photo of a tabby cat sitting on a wooden chair, sharp focus"
  - "a portrait of a young woman with red hair, studio lighting"
  - "an oil painting of a stormy ocean at sunset, dramatic clouds"
  - "a futuristic city skyline at night, neon lights, cyberpunk"
  - "a close-up of a red apple with water droplets, macro photography"
  - "a golden retriever puppy running in a meadow, motion blur"
  - "a coffee shop interior with warm lighting, plants, books"
  - "a fantasy castle on a mountain, mist, soft light"

# Number of images generated for FID/CLIP (sampled from MS-COCO captions if available,
# else falls back to repeated eval_prompts with different seeds)
fid_num_samples: 500

# Benchmark
benchmark_runs:    5
benchmark_warmup:  1
